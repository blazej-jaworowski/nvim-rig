[package]
name = "nvim-rig"
version = "0.1.0"
edition = "2024"

[dependencies]
eel = { version = "0.0.3", git = "https://github.com/blazej-jaworowski/eel" }
eel-nvim = { version = "0.0.3", git = "https://github.com/blazej-jaworowski/eel" }

rig-core = { version = "0.24.0", default-features = false, features = ["reqwest-rustls"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["rt", "rt-multi-thread", "sync"] }
tracing = "0.1.41"
strum = { version = "0.27.2", features = ["derive"] }
futures = "0.3.31"
serde_json = "1.0.145"
itertools = "0.14.0"
derivative = "2.2.0"
